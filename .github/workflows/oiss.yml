name: Actualizar datos del mar (NOAA OISST)

on:
  schedule:
    - cron: "17 13 * * *"   # todos los días a las 08:17 hora de Lima
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar NOAA OISST y calcular Niño 1+2 y Niño 3.4
        run: python scripts/update_oisst.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oisst.json
          git diff --staged --quiet || git commit -m "Datos NOAA OISST $(date -u +%F)"
          git push
